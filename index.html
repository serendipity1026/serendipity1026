<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="贾储嘉，大连科技学院电气工程及其自动化本科生。研究兴趣包括电力系统、电力电子、电机驱动和自动控制。">
  <meta name="theme-color" content="#f5f5f0">
  <meta name="color-scheme" content="light">
  <title>贾储嘉 · Chujia Jia</title>
  <style>
    :root {
      --paper: #f5f5f0;
      --ink: #161d2a;
      --muted: #525a67;
      --line: #dedfd9;
      --navy: #182536;
      --lime: #dbff86;
      --page: 1160px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.65 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 3px solid #537c9d; outline-offset: 5px; }
    h1, h2, h3, p { margin: 0; }
    [hidden] { display: none !important; }
    .wrap { width: min(var(--page), calc(100% - 80px)); margin-inline: auto; }
    .skip {
      position: fixed;
      left: 1rem;
      top: 1rem;
      z-index: 5;
      padding: 8px 14px;
      background: white;
      transform: translateY(-170%);
    }
    .skip:focus { transform: translateY(0); }
    .site-header { border-bottom: 1px solid var(--line); }
    .topbar { display: flex; align-items: center; gap: 28px; min-height: 76px; }
    .wordmark { display: inline-flex; align-items: center; gap: 11px; font-weight: 750; }
    .monogram {
      display: grid;
      place-items: center;
      width: 37px;
      aspect-ratio: 1;
      border-radius: 9px;
      background: var(--navy);
      color: var(--lime);
      font: 700 13px/1 ui-monospace, Consolas, monospace;
    }
    nav { display: flex; gap: 26px; margin-left: auto; color: var(--muted); font-size: 14px; }
    nav a:hover, .text-link:hover { text-decoration: underline; text-underline-offset: 5px; }
    .language {
      min-width: 44px;
      border: 1px solid #cacdc7;
      border-radius: 7px;
      background: transparent;
      padding: 5px 9px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }
    .language:hover { background: white; }
    .hero {
      display: grid;
      grid-template-columns: 1fr .92fr;
      gap: clamp(32px, 6vw, 90px);
      align-items: center;
      padding-block: clamp(50px, 8vw, 103px) clamp(53px, 7vw, 89px);
    }
    .school { display: flex; gap: 9px; align-items: center; color: var(--muted); font-size: 15px; font-weight: 650; }
    .school::before { content: ""; width: 8px; height: 8px; background: #537a41; border-radius: 50%; }
    h1 { margin-top: 15px; font-size: clamp(52px, 8vw, 97px); line-height: 1.04; letter-spacing: -.08em; }
    .other-name { margin-top: 10px; color: var(--muted); font-size: clamp(20px, 2.65vw, 34px); line-height: 1.15; letter-spacing: -.035em; }
    .role { margin-top: 23px; font-size: clamp(16px, 1.7vw, 21px); font-weight: 650; line-height: 1.45; }
    .focus-areas { display: flex; flex-wrap: wrap; gap: 6px 10px; margin: 11px 0 0; padding: 0; list-style: none; color: var(--muted); font-size: 15px; }
    .focus-areas li + li::before { content: "·"; margin-right: 10px; }
    .hero-links { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; margin-top: 28px; }
    .button-link { display: inline-flex; gap: 12px; align-items: center; padding: 9px 15px; border-radius: 8px; background: var(--navy); color: white; font-size: 14px; font-weight: 650; }
    .button-link:hover { background: #2e435c; }
    .text-link { color: #303c51; font-size: 14px; font-weight: 650; }
    .hero-art { position: relative; min-width: 0; overflow: hidden; aspect-ratio: 1.27; border-radius: 20px; background: var(--navy); }
    .hero-art canvas, .project-art canvas { display: block; width: 100%; height: 100%; }
    .section { padding-block: 48px; border-top: 1px solid var(--line); scroll-margin-top: 18px; }
    h2 { font-size: clamp(29px, 4vw, 44px); line-height: 1.15; letter-spacing: -.04em; font-weight: 750; }
    .projects { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 17px; margin-top: 25px; }
    .project { min-width: 0; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: #fff; }
    .project-art { aspect-ratio: 2.6; }
    .motor { background: #e6e8f4; }
    .water { background: #e0eef5; }
    .irrigation { background: #e4eddf; }
    .project-copy { padding: 19px 21px 24px; }
    .project-role { color: #465671; font-size: 12px; font-weight: 750; }
    .project h3 { margin-top: 6px; font-size: clamp(17px, 2vw, 22px); line-height: 1.35; }
    .project-copy p:last-child { margin-top: 10px; color: var(--muted); font-size: 14px; }
    .profile-row { display: grid; grid-template-columns: minmax(150px, .6fr) 1fr; gap: 25px; align-items: baseline; }
    .profile-row strong { display: block; font-size: 20px; }
    .profile-row p { color: var(--muted); }
    .honors { margin: 0; padding: 0; list-style: none; }
    .honors li { display: grid; grid-template-columns: minmax(3em, auto) 1fr; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .honors time { color: var(--muted); font-variant-numeric: tabular-nums; }
    .site-footer { border-top: 1px solid var(--line); }
    .footer-inner { display: flex; justify-content: space-between; gap: 14px; padding-block: 19px; color: var(--muted); font-size: 13px; }
    html[lang="en"] h1 { font-size: clamp(46px, 6.5vw, 85px); letter-spacing: -.065em; }
    @media (max-width: 850px) {
      .wrap { width: calc(100% - 48px); }
      .hero { gap: 28px; }
      .project-copy { padding-inline: 16px; }
    }
    @media (max-width: 640px) {
      .wrap { width: calc(100% - 36px); }
      .topbar { flex-wrap: wrap; justify-content: space-between; gap: 11px 18px; padding-block: 12px; }
      nav { order: 1; width: 100%; margin-left: 0; gap: 20px; flex-wrap: wrap; }
      .hero { grid-template-columns: 1fr; padding-block: 39px; }
      .hero-art { aspect-ratio: 1.63; }
      .projects { grid-template-columns: 1fr; }
      .project-art { max-height: 160px; }
      .profile-row { grid-template-columns: 1fr; gap: 15px; }
      .section { padding-block: 34px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body id="top">

  <!-- 填写荣誉：在下面的 [] 内加入条目。填写 year 和 zh，en 可以留空。
       格式示例：{"year":"年份","zh":"奖项名称及级别","en":"English award title"}
       有多条时，用英文逗号分隔。 -->
  <script type="application/json" id="honors-data">
  []
  </script>
  <script>
    const languageButton = document.querySelector(".language");
    const otherName = document.querySelector(".other-name");
    const translations = Array.from(document.querySelectorAll("[data-en]"), element => ({
      element, zh: element.textContent, en: element.dataset.en
    }));
    const labels = Array.from(document.querySelectorAll("[data-label-en]"), element => ({
      element, zh: element.getAttribute("aria-label"), en: element.dataset.labelEn
    }));
    const honorsList = document.querySelector("#honors-list");
    const honorsEmpty = document.querySelector("#honors-empty");
    let honors = [];

    try {
      const entries = JSON.parse(document.querySelector("#honors-data").textContent);
      if (Array.isArray(entries)) {
        honors = entries.filter(entry => typeof entry?.zh === "string" && entry.zh.trim());
      }
    } catch (error) {
      console.warn("Check the JSON in honors-data.", error);
    }

    function renderHonors(language) {
      honorsList.replaceChildren();
      for (const award of honors) {
        const item = document.createElement("li");
        const year = document.createElement("time");
        const name = document.createElement("span");
        year.textContent = award.year ?? "";
        if (/^\d{4}$/.test(year.textContent)) year.dateTime = year.textContent;
        name.textContent = language === "en" && award.en ? award.en : award.zh;
        item.append(year, name);
        honorsList.append(item);
      }
      honorsEmpty.hidden = honors.length > 0;
      honorsList.hidden = honors.length === 0;
    }

    function setLanguage(language) {
      const english = language === "en";
      document.documentElement.lang = english ? "en" : "zh-CN";
      otherName.lang = english ? "zh-CN" : "en";
      for (const translation of translations) translation.element.textContent = translation[language];
      for (const label of labels) label.element.setAttribute("aria-label", label[language]);
      languageButton.textContent = english ? "中文" : "EN";
      languageButton.lang = english ? "zh-CN" : "en";
      languageButton.setAttribute("aria-label", english ? "切换至中文" : "Switch to English");
      renderHonors(language);
      try { localStorage.setItem("chujia-jia-language", language); } catch {}
    }

    let language = "zh";
    try {
      if (localStorage.getItem("chujia-jia-language") === "en") language = "en";
    } catch {}
    setLanguage(language);
    languageButton.hidden = false;
    languageButton.addEventListener("click", () => {
      language = language === "zh" ? "en" : "zh";
      setLanguage(language);
    });

    // The drawings are original illustrations, with the same coordinate system at all screen sizes.
    function line(ctx, points, color, width = 1.5) {
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      points.forEach(([x, y], i) => i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
      ctx.stroke();
    }

    function ring(ctx, x, y, radius, color, width = 1.5) {
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.stroke();
    }

    function grid(ctx, w, h, spacing, color) {
      ctx.fillStyle = color;
      for (let x = spacing / 2; x < w; x += spacing) {
        for (let y = spacing / 2; y < h; y += spacing) ctx.fillRect(x, y, 1.5, 1.5);
      }
    }

    const drawings = {
      board(ctx) {
        const faint = "#42596b";
        const trace = "#8bafbd";
        const signal = "#dbff86";
        grid(ctx, 540, 420, 16, faint);
        ctx.translate(270, 210);
        for (let i = 0; i < 5; i++) {
          const y = -55 + i * 27;
          const color = i === 2 ? signal : i % 2 === 0 ? trace : faint;
          const bend = 132 + i * 6;
          const endY = y + (i < 2 ? -42 : 46);
          for (const sign of [-1, 1]) {
            line(ctx, [[sign * 76, y], [sign * 112, y], [sign * bend, endY], [sign * 194, endY]], color, i === 2 ? 2.4 : 1.4);
            ring(ctx, sign * 200, endY, 5.5, color, 1.8);
          }
        }
        for (let i = 0; i < 4; i++) {
          const x = -49 + i * 33;
          for (const sign of [-1, 1]) {
            const endX = x + (i < 2 ? -23 : 24);
            line(ctx, [[x, sign * 77], [x, sign * 106], [endX, sign * 130]], i === 1 ? trace : faint);
            ring(ctx, endX, sign * 135, 4.5, i === 1 ? trace : faint);
          }
        }
        ctx.fillStyle = "#24384a";
        ctx.fillRect(-78, -78, 156, 156);
        ctx.strokeStyle = trace;
        ctx.lineWidth = 2;
        ctx.strokeRect(-78, -78, 156, 156);
        ctx.strokeStyle = faint;
        ctx.strokeRect(-62, -62, 124, 124);
        line(ctx, [[-46, 10], [-30, 10], [-20, -21], [-4, 31], [12, -30], [24, 10], [46, 10]], signal, 3.3);
        ring(ctx, -58, -58, 3.2, signal);
      },
      motor(ctx) {
        grid(ctx, 340, 130, 13, "#b8bbd4");
        const stroke = "#3b496e";
        ctx.translate(170, 65);
        ring(ctx, 0, 0, 45, stroke, 1.4);
        ring(ctx, 0, 0, 32, stroke, 2);
        ring(ctx, 0, 0, 16, stroke, 2);
        for (let i = 0; i < 8; i++) {
          ctx.save();
          ctx.rotate(i * Math.PI / 4);
          line(ctx, [[-7, -43], [-7, -28], [0, -24], [7, -28], [7, -43]], stroke);
          ctx.restore();
        }
        line(ctx, [[-45, 0], [-78, 0], [-90, 17], [-112, 17]], stroke);
        line(ctx, [[45, 0], [78, 0], [90, -17], [112, -17]], stroke);
        ring(ctx, -116, 17, 4, stroke);
        ring(ctx, 116, -17, 4, stroke);
      },
      water(ctx) {
        grid(ctx, 340, 130, 13, "#a7c2d2");
        const stroke = "#39637e";
        line(ctx, [[35, 87], [115, 45], [304, 45]], stroke, 2);
        line(ctx, [[72, 100], [124, 72], [304, 72]], stroke, 2);
        ctx.setLineDash([10, 7]);
        line(ctx, [[52, 94], [120, 59], [304, 59]], stroke);
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.moveTo(117, 98);
        ctx.bezierCurveTo(139, 80, 153, 106, 181, 89);
        ctx.bezierCurveTo(202, 74, 216, 86, 238, 88);
        ctx.bezierCurveTo(268, 101, 216, 108, 183, 110);
        ctx.bezierCurveTo(153, 110, 104, 110, 117, 98);
        ctx.fillStyle = "#73a6bd";
        ctx.fill();
      },
      irrigation(ctx) {
        grid(ctx, 340, 130, 13, "#b3c7ac");
        const stroke = "#42634c";
        ctx.strokeStyle = stroke;
        ctx.lineWidth = 2;
        ctx.strokeRect(81, 37, 70, 57);
        ctx.font = "bold 13px Consolas, monospace";
        ctx.textAlign = "center";
        ctx.fillStyle = stroke;
        ctx.fillText("STM32", 116, 70);
        for (const y of [48, 66, 83]) {
          line(ctx, [[63, y], [81, y]], stroke);
          ring(ctx, 59, y, 4, stroke);
        }
        line(ctx, [[151, 65], [216, 65], [216, 33], [242, 33]], stroke, 2);
        line(ctx, [[151, 83], [228, 83], [228, 94], [261, 94]], stroke, 2);
        for (const x of [250, 269, 288]) {
          line(ctx, [[x, 41], [x - 5, 51], [x + 5, 51], [x, 41]], stroke);
        }
        line(ctx, [[246, 33], [292, 33]], stroke, 2);
        line(ctx, [[275, 97], [275, 70], [263, 64], [266, 77], [275, 82], [285, 76], [290, 66], [278, 70]], stroke, 2);
      }
    };

    function draw(canvas) {
      const ctx = canvas.getContext("2d");
      if (!ctx) return;
      const pixelRatio = window.devicePixelRatio || 1;
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      canvas.width = width * pixelRatio;
      canvas.height = height * pixelRatio;
      const isBoard = canvas.dataset.art === "board";
      const [artWidth, artHeight] = isBoard ? [540, 420] : [340, 130];
      const scale = Math.min(width / artWidth, height / artHeight) * pixelRatio;
      ctx.setTransform(scale, 0, 0, scale, (canvas.width - artWidth * scale) / 2, (canvas.height - artHeight * scale) / 2);
      drawings[canvas.dataset.art](ctx);
    }

    const canvases = document.querySelectorAll("[data-art]");
    const observer = new ResizeObserver(entries => entries.forEach(entry => draw(entry.target)));
    for (const canvas of canvases) observer.observe(canvas);
  </script>
